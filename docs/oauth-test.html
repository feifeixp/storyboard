<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三方 OAuth 登录模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 520px;
      max-width: 95%;
    }
    .card {
      background: rgba(22, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 28px;
    }
    .step-badge {
      display: inline-block;
      background: rgba(94,96,206,0.15);
      color: #8b8df8;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(94,96,206,0.2);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: rgba(94,96,206,0.5);
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input[readonly] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, #5e60ce, #7950f2);
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(94,96,206,0.35);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 24px 0;
    }
    .result-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.8;
      max-height: 400px;
      overflow-y: auto;
      word-break: break-all;
    }
    .result-box::-webkit-scrollbar { width: 4px; }
    .result-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .result-box .label {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }
    .result-box .value {
      color: #8b8df8;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .result-box .success { color: #51cf66; }
    .result-box .error { color: #ff6b6b; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .status-bar.info {
      background: rgba(94,96,206,0.1);
      border: 1px solid rgba(94,96,206,0.2);
      color: #8b8df8;
    }
    .status-bar.success {
      background: rgba(81,207,102,0.08);
      border: 1px solid rgba(81,207,102,0.2);
      color: #51cf66;
    }
    .status-bar.error {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.2);
      color: #ff6b6b;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.info { background: #8b8df8; }
    .dot.success { background: #51cf66; }
    .dot.error { background: #ff6b6b; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      margin-top: 16px;
    }
    .user-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5e60ce, #7950f2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }
    .user-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .hidden { display: none; }
    .log-area {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      max-height: 200px;
      overflow-y: auto;
      color: rgba(255,255,255,0.5);
    }
    .log-area .log-time { color: rgba(255,255,255,0.25); }
    .log-area .log-info { color: #8b8df8; }
    .log-area .log-success { color: #51cf66; }
    .log-area .log-error { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="container">
  <!-- ===== 第一步：发起授权 ===== -->
  <div class="card" id="step1-card">
    <div class="step-badge">STEP 1 — 发起授权</div>
    <h1>三方 OAuth 登录模拟</h1>
    <p class="subtitle">模拟第三方应用发起 OAuth 2.0 授权流程</p>

    <div class="form-group">
      <label>API 基础地址</label>
      <input type="text" id="apiBase" value="https://neowow.neodomain.cn" placeholder="https://neowow.neodomain.cn">
    </div>
    <div class="form-group">
      <label>Client ID</label>
      <input type="text" id="clientId" value="demo_app_001" placeholder="app_xxxxx">
    </div>
    <div class="form-group">
      <label>Client Secret（换取 Token 时使用）</label>
      <input type="text" id="clientSecret" value="2e1705b2a417c29d765145b7921993389d2543b2e220151fc3d9be0a1a63a410" placeholder="secret_xxxxx">
    </div>
    <div class="form-group">
      <label>Redirect URI</label>
      <input type="text" id="redirectUri" readonly>
    </div>
    <div class="form-group">
      <label>Response Type</label>
      <input type="text" value="code" readonly>
    </div>
    <div class="form-group">
      <label>State（自动生成时间戳）</label>
      <input type="text" id="stateValue" readonly>
    </div>

    <button class="btn btn-primary" id="authorizeBtn" onclick="startAuthorize()">发起授权请求</button>

    <div id="step1-log" class="log-area hidden"></div>
  </div>

  <!-- ===== 第二步：回调换取 Token ===== -->
  <div class="card hidden" id="step2-card">
    <div class="step-badge">STEP 2 — 换取 Token</div>
    <h1>授权回调</h1>
    <p class="subtitle">已从授权服务器获得授权码，正在换取 Access Token</p>

    <div id="callback-status"></div>

    <div class="form-group">
      <label>Authorization Code</label>
      <input type="text" id="authCode" readonly>
    </div>
    <div class="form-group">
      <label>State</label>
      <input type="text" id="callbackState" readonly>
    </div>

    <div id="token-result" class="hidden"></div>
    <div id="step2-log" class="log-area"></div>

    <div class="divider"></div>
    <button class="btn btn-secondary" onclick="resetFlow()">重新发起授权</button>
  </div>
</div>

<script>
  // 初始化
  const currentUrl = new URL(window.location.href);
  const callbackUrl = currentUrl.origin + currentUrl.pathname;

  // 持久化配置到 localStorage
  function saveConfig() {
    const config = {
      apiBase: document.getElementById('apiBase').value,
      clientId: document.getElementById('clientId').value,
      clientSecret: document.getElementById('clientSecret').value
    };
    localStorage.setItem('oauth_test_config', JSON.stringify(config));
  }

  function loadConfig() {
    try {
      const saved = localStorage.getItem('oauth_test_config');
      if (saved) {
        const config = JSON.parse(saved);
        if (config.apiBase) document.getElementById('apiBase').value = config.apiBase;
        if (config.clientId) document.getElementById('clientId').value = config.clientId;
        if (config.clientSecret) document.getElementById('clientSecret').value = config.clientSecret;
      }
    } catch(e) {}
  }

  // 日志工具
  function log(targetId, msg, type = 'info') {
    const area = document.getElementById(targetId);
    area.classList.remove('hidden');
    const time = new Date().toLocaleTimeString();
    area.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span></div>`;
    area.scrollTop = area.scrollHeight;
  }

  // 检查是否是回调（URL 中包含 code 参数）
  function checkCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');

    if (code) {
      // 回调模式
      document.getElementById('step1-card').classList.add('hidden');
      document.getElementById('step2-card').classList.remove('hidden');
      document.getElementById('authCode').value = code;
      document.getElementById('callbackState').value = state || '';

      // 验证 state
      const savedState = localStorage.getItem('oauth_state');
      if (savedState && state !== savedState) {
        setCallbackStatus('error', 'State 不匹配！可能存在 CSRF 攻击风险');
        log('step2-log', `State 验证失败: 期望 ${savedState}，实际 ${state}`, 'error');
        return;
      }
      log('step2-log', 'State 验证通过', 'success');
      log('step2-log', `授权码: ${code}`, 'info');

      // 自动换取 Token
      exchangeToken(code);
    } else {
      // 发起授权模式
      loadConfig();
      document.getElementById('redirectUri').value = callbackUrl;
      document.getElementById('stateValue').value = Date.now().toString();
    }
  }

  function setCallbackStatus(type, text) {
    const el = document.getElementById('callback-status');
    el.innerHTML = `<div class="status-bar ${type}"><div class="dot ${type}"></div>${text}</div>`;
  }

  function setCallbackLoading(text) {
    const el = document.getElementById('callback-status');
    el.innerHTML = `<div class="status-bar info"><div class="spinner"></div>${text}</div>`;
  }

  // 第一步：发起授权
  async function startAuthorize() {
    const apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
    const clientId = document.getElementById('clientId').value;
    const redirectUri = document.getElementById('redirectUri').value;
    const state = document.getElementById('stateValue').value;

    if (!apiBase) { alert('请填写 API 基础地址'); return; }
    if (!clientId) { alert('请填写 Client ID'); return; }

    // 保存配置
    saveConfig();
    // 保存 state 用于回调验证
    localStorage.setItem('oauth_state', state);

    const btn = document.getElementById('authorizeBtn');
    btn.disabled = true;
    btn.textContent = '请求中...';

    const url = `${apiBase}/user/oauth/authorize?clientId=${encodeURIComponent(clientId)}&redirectUri=${encodeURIComponent(redirectUri)}&responseType=code&state=${encodeURIComponent(state)}`;

    log('step1-log', `GET ${url}`, 'info');

    try {
      const resp = await fetch(url);
      const data = await resp.json();
      log('step1-log', `响应: ${JSON.stringify(data)}`, data.success ? 'success' : 'error');

      if (data.success && data.data) {
        log('step1-log', `即将跳转到: ${data.data}`, 'success');
        setTimeout(() => {
          window.location.href = data.data;
        }, 800);
      } else {
        log('step1-log', `授权失败: ${data.errMessage || '未知错误'}`, 'error');
        btn.disabled = false;
        btn.textContent = '发起授权请求';
      }
    } catch (err) {
      log('step1-log', `请求异常: ${err.message}`, 'error');
      btn.disabled = false;
      btn.textContent = '发起授权请求';
    }
  }

  // 第二步：用授权码换取 Token
  async function exchangeToken(code) {
    // 从 localStorage 加载配置
    let apiBase = '', clientId = '', clientSecret = '';
    try {
      const saved = JSON.parse(localStorage.getItem('oauth_test_config') || '{}');
      apiBase = saved.apiBase || '';
      clientId = saved.clientId || '';
      clientSecret = saved.clientSecret || '';
    } catch(e) {}

    if (!apiBase || !clientId || !clientSecret) {
      setCallbackStatus('error', '缺少配置信息（apiBase / clientId / clientSecret），请重新发起授权');
      log('step2-log', '配置信息丢失，无法换取 Token', 'error');
      return;
    }

    setCallbackLoading('正在换取 Access Token...');

    const url = `${apiBase}/user/oauth/token`;
    const body = {
      grantType: 'authorization_code',
      code: code,
      redirectUri: callbackUrl,
      clientId: clientId,
      clientSecret: clientSecret
    };

    log('step2-log', `POST ${url}`, 'info');
    log('step2-log', `请求体: ${JSON.stringify(body, null, 2)}`, 'info');

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await resp.json();
      log('step2-log', `响应: ${JSON.stringify(data)}`, data.success ? 'success' : 'error');

      if (data.success && data.data) {
        setCallbackStatus('success', 'Token 获取成功！');
        showTokenResult(data.data);
      } else {
        setCallbackStatus('error', `换取 Token 失败: ${data.errMessage || '未知错误'}`);
      }
    } catch (err) {
      log('step2-log', `请求异常: ${err.message}`, 'error');
      setCallbackStatus('error', `请求异常: ${err.message}`);
    }
  }

  // 显示 Token 结果
  function showTokenResult(tokenData) {
    const el = document.getElementById('token-result');
    el.classList.remove('hidden');

    // 用户信息卡片
    const avatarContent = tokenData.avatar
      ? `<img src="${tokenData.avatar}" alt="avatar">`
      : (tokenData.nickname || 'U').charAt(0).toUpperCase();

    el.innerHTML = `
      <div class="user-card">
        <div class="user-avatar">${avatarContent}</div>
        <div class="user-info">
          <div class="user-name">${tokenData.nickname || '未知用户'}</div>
          <div class="user-meta">${tokenData.mobile || tokenData.email || tokenData.userId || ''}</div>
        </div>
      </div>
      <div class="result-box">
        <div><span class="label">Access Token: </span><span class="value">${tokenData.accessToken || '-'}</span></div>
        <div><span class="label">Token Type: </span><span class="value">${tokenData.tokenType || '-'}</span></div>
        <div><span class="label">Expires In: </span><span class="value">${tokenData.expiresIn || '-'} 秒</span></div>
        <div><span class="label">User ID: </span><span class="value">${tokenData.userId || '-'}</span></div>
        <div><span class="label">Nickname: </span><span class="value">${tokenData.nickname || '-'}</span></div>
        <div><span class="label">Email: </span><span class="value">${tokenData.email || '-'}</span></div>
        <div><span class="label">Mobile: </span><span class="value">${tokenData.mobile || '-'}</span></div>
        <div><span class="label">User Type: </span><span class="value">${tokenData.userType || '-'}</span></div>
        <div><span class="label">Status: </span><span class="value">${tokenData.status}</span></div>
      </div>
    `;
  }

  // 重置流程
  function resetFlow() {
    localStorage.removeItem('oauth_state');
    // 去掉 URL 中的 query 参数
    window.location.href = callbackUrl;
  }

  // 入口
  checkCallback();
</script>
</body>
</html>

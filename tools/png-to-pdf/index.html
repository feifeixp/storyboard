<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNG → PDF 转换工具</title>
  <meta name="description" content="在线 PNG 图片批量转 PDF 工具，支持拖拽上传、自由排序、一键导出" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6fff;
      --accent2: #a78bfa;
      --accent-glow: rgba(124,111,255,0.35);
      --text: #f0f0f8;
      --text-muted: #8888aa;
      --danger: #ff5f6d;
      --success: #4ade80;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,111,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167,139,250,0.10) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 40px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.7);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .header-badge {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--accent2);
      background: rgba(124,111,255,0.15);
      border: 1px solid rgba(124,111,255,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.5px;
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 40px 24px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.65;
    }

    /* ── Drop Zone ── */
    #drop-zone {
      border: 2px dashed rgba(124,111,255,0.35);
      border-radius: var(--radius);
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(124,111,255,0.04);
      position: relative;
      margin-bottom: 32px;
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124,111,255,0.10);
      box-shadow: 0 0 40px rgba(124,111,255,0.15), inset 0 0 40px rgba(124,111,255,0.04);
      transform: scale(1.005);
    }

    #drop-zone.drag-over::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: rgba(124,111,255,0.08);
      animation: pulse-bg 0.8s ease infinite alternate;
    }

    @keyframes pulse-bg {
      from { opacity: 0.5; }
      to   { opacity: 1; }
    }

    .drop-icon {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, rgba(124,111,255,0.3), rgba(167,139,250,0.2));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 20px rgba(124,111,255,0.2);
      transition: var(--transition);
    }

    #drop-zone:hover .drop-icon {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(124,111,255,0.35);
    }

    .drop-text-main {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .drop-text-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .drop-text-sub span {
      color: var(--accent2);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-style: dotted;
      cursor: pointer;
    }

    #file-input { display: none; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
    }

    .file-count strong { color: var(--accent2); }

    /* ── Page Size & Orientation ── */
    .options-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 14px 6px 10px;
    }

    .option-group label {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .option-group select {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    .option-group select option { background: var(--surface2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124,111,255,0.5);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surface); color: var(--text); border-color: rgba(255,255,255,0.15); }

    .btn-danger {
      background: rgba(255,95,109,0.1);
      color: var(--danger);
      border: 1px solid rgba(255,95,109,0.25);
    }

    .btn-danger:hover { background: rgba(255,95,109,0.2); border-color: rgba(255,95,109,0.5); }

    /* ── Image Grid ── */
    #image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .img-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      cursor: grab;
      transition: var(--transition);
      user-select: none;
      animation: card-in 0.3s ease both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .img-card:hover {
      border-color: rgba(124,111,255,0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .img-card.dragging {
      opacity: 0.45;
      cursor: grabbing;
      transform: scale(0.96);
      border-color: var(--accent);
    }

    .img-card.drag-target {
      border-color: var(--accent2);
      box-shadow: 0 0 0 2px var(--accent2);
    }

    .img-preview {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      background: #0d0d14;
    }

    .img-info {
      padding: 8px 10px;
    }

    .img-name {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .img-page-num {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 7px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .img-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px; height: 26px;
      background: rgba(255,95,109,0.15);
      border: 1px solid rgba(255,95,109,0.3);
      border-radius: 6px;
      color: var(--danger);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: var(--transition);
    }

    .img-card:hover .img-remove { opacity: 1; }
    .img-remove:hover { background: rgba(255,95,109,0.35); }

    /* ── Empty State ── */
    #empty-state {
      text-align: center;
      padding: 48px 24px;
      display: none;
    }

    #empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    #empty-state p { color: var(--text-muted); font-size: 0.9rem; }

    /* ── Quality Slider ── */
    .quality-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 20px;
      display: none;
    }

    .quality-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .quality-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quality-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .quality-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider-label { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }

    input[type=range]#quality-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 99px;
      background: var(--surface);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }

    input[type=range]#quality-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.15);
      transition: transform 0.15s;
    }

    input[type=range]#quality-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    input[type=range]#quality-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .quality-stops {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      padding: 0 2px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Progress ── */
    #progress-wrap {
      display: none;
      margin-bottom: 24px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      font-size: 0.875rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.success { border-color: rgba(74,222,128,0.4); }
    #toast.error   { border-color: rgba(255,95,109,0.4); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      main { padding: 24px 16px 48px; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      #image-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📄</div>
    PNG → PDF
  </div>
  <span class="header-badge">本地处理 · 无需上传</span>
</header>

<main>
  <section class="hero">
    <h1>PNG 批量转 PDF</h1>
    <p>将多张图片快速合并为一份 PDF 文档。拖拽排序，一键导出，文件不离开你的电脑。</p>
  </section>

  <!-- Drop Zone -->
  <div id="drop-zone" role="button" tabindex="0" aria-label="上传图片区域">
    <div class="drop-icon">🖼️</div>
    <p class="drop-text-main">拖拽 PNG / JPG 图片到此处</p>
    <p class="drop-text-sub">或者 <span id="browse-btn">点击浏览文件</span></p>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" multiple />
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="toolbar-left">
      <span class="file-count">共 <strong id="count-label">0</strong> 张图片</span>
      <div class="options-bar">
        <div class="option-group">
          <label>📐 纸张</label>
          <select id="page-size">
            <option value="a4">A4</option>
            <option value="a3">A3</option>
            <option value="letter">Letter</option>
            <option value="fit">适应图片</option>
          </select>
        </div>
        <div class="option-group">
          <label>🔄 方向</label>
          <select id="orientation">
            <option value="auto">自动</option>
            <option value="portrait">纵向</option>
            <option value="landscape">横向</option>
          </select>
        </div>
        <div class="option-group">
          <label>📏 边距</label>
          <select id="margin">
            <option value="0">无边距</option>
            <option value="10" selected>小</option>
            <option value="20">中</option>
            <option value="30">大</option>
          </select>
        </div>
      </div>
    </div>
    <button class="btn btn-ghost" id="clear-btn">🗑 清空</button>
    <button class="btn btn-primary" id="export-btn">⬇ 导出 PDF</button>
  </div>

  <!-- Quality Panel -->
  <div class="quality-panel" id="quality-panel">
    <div class="quality-header">
      <span class="quality-title">🗜️ 图片压缩（转 JPEG）
        <span class="quality-badge" id="quality-badge">85%</span>
      </span>
      <span class="quality-hint" id="quality-hint">推荐范围：70–90%，兼顾清晰度与文件大小</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">最小体积</span>
      <input type="range" id="quality-slider" min="10" max="100" value="85" step="1" aria-label="JPEG 压缩质量" />
      <span class="slider-label">最高质量</span>
    </div>
    <div class="quality-stops">
      <span>10%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
    </div>
  </div>

  <!-- Progress -->
  <div id="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">正在生成 PDF…</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Grid -->
  <div id="image-grid"></div>
  <div id="empty-state">
    <div class="empty-icon">🪄</div>
    <p>添加图片后，拖拽卡片可以调整顺序</p>
  </div>
</main>

<!-- Toast -->
<div id="toast" role="alert" aria-live="polite"></div>

<script>
(function () {
  /* ── State ── */
  const files = []; // { id, file, url, name }
  let idSeq = 0;
  let dragSrcId = null;

  /* ── Elements ── */
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const browseBtn  = document.getElementById('browse-btn');
  const grid       = document.getElementById('image-grid');
  const toolbar    = document.getElementById('toolbar');
  const emptyState = document.getElementById('empty-state');
  const countLabel = document.getElementById('count-label');
  const exportBtn  = document.getElementById('export-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const progWrap   = document.getElementById('progress-wrap');
  const progFill   = document.getElementById('progress-fill');
  const progPct    = document.getElementById('progress-pct');
  const progText   = document.getElementById('progress-text');
  const toast      = document.getElementById('toast');
  const qualityPanel  = document.getElementById('quality-panel');
  const qualitySlider = document.getElementById('quality-slider');
  const qualityBadge  = document.getElementById('quality-badge');
  const qualityHint   = document.getElementById('quality-hint');

  /* ── Quality Slider Logic ── */
  function updateQuality(val) {
    qualityBadge.textContent = val + '%';
    // Update badge color based on quality
    if (val >= 80) {
      qualityBadge.style.background = 'rgba(74,222,128,0.15)';
      qualityBadge.style.color      = '#4ade80';
      qualityBadge.style.border     = '1px solid rgba(74,222,128,0.3)';
      qualityHint.textContent = val === 100
        ? '原始质量，文件尺寸最大'
        : '高质量，小幅压缩，适合印刷或展示';
    } else if (val >= 60) {
      qualityBadge.style.background = 'rgba(250,204,21,0.15)';
      qualityBadge.style.color      = '#facc15';
      qualityBadge.style.border     = '1px solid rgba(250,204,21,0.3)';
      qualityHint.textContent = '推荐范围：70–90%，兼顾清晰度与文件大小';
    } else if (val >= 35) {
      qualityBadge.style.background = 'rgba(251,146,60,0.15)';
      qualityBadge.style.color      = '#fb923c';
      qualityBadge.style.border     = '1px solid rgba(251,146,60,0.3)';
      qualityHint.textContent = '中等压缩，可能出现少量模糊，适合电子文档';
    } else {
      qualityBadge.style.background = 'rgba(255,95,109,0.15)';
      qualityBadge.style.color      = '#ff5f6d';
      qualityBadge.style.border     = '1px solid rgba(255,95,109,0.3)';
      qualityHint.textContent = '高度压缩，文件最小但番考明显降低';
    }
    // Update slider track fill color
    const pct = ((val - 10) / 90) * 100;
    qualitySlider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent2) ${pct}%, var(--surface) ${pct}%)`;
  }

  qualitySlider.addEventListener('input', () => updateQuality(parseInt(qualitySlider.value, 10)));
  updateQuality(85); // initialize

  /* ── Drop Zone events ── */
  browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  /* ── File handling ── */
  function handleFiles(fileList) {
    const accepted = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!accepted.length) { showToast('⚠️ 请选择图片文件（PNG/JPG/WebP）', 'error'); return; }
    accepted.forEach(f => addFile(f));
    render();
  }

  function addFile(file) {
    const id = ++idSeq;
    const url = URL.createObjectURL(file);
    files.push({ id, file, url, name: file.name });
  }

  function removeFile(id) {
    const idx = files.findIndex(f => f.id === id);
    if (idx !== -1) { URL.revokeObjectURL(files[idx].url); files.splice(idx, 1); }
    render();
  }

  clearBtn.addEventListener('click', () => {
    files.forEach(f => URL.revokeObjectURL(f.url));
    files.length = 0;
    render();
  });

  /* ── Render grid ── */
  function render() {
    grid.innerHTML = '';
    countLabel.textContent = files.length;
    toolbar.style.display       = files.length ? 'flex' : 'none';
    qualityPanel.style.display  = files.length ? 'block' : 'none';
    emptyState.style.display    = files.length ? 'none' : 'block';

    files.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'img-card';
      card.draggable = true;
      card.dataset.id = item.id;

      card.innerHTML = `
        <img class="img-preview" src="${item.url}" alt="${item.name}" loading="lazy" />
        <span class="img-page-num">P${index + 1}</span>
        <button class="img-remove" title="移除" aria-label="移除 ${item.name}">✕</button>
        <div class="img-info"><span class="img-name" title="${item.name}">${item.name}</span></div>
      `;

      card.querySelector('.img-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeFile(item.id);
      });

      /* Drag-to-reorder */
      card.addEventListener('dragstart', (e) => {
        dragSrcId = item.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.img-card').forEach(c => c.classList.remove('drag-target'));
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.img-card').forEach(c => c.classList.remove('drag-target'));
        if (dragSrcId !== item.id) card.classList.add('drag-target');
      });

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dragSrcId === item.id) return;
        const srcIdx = files.findIndex(f => f.id === dragSrcId);
        const dstIdx = files.findIndex(f => f.id === item.id);
        if (srcIdx === -1 || dstIdx === -1) return;
        const [moved] = files.splice(srcIdx, 1);
        files.splice(dstIdx, 0, moved);
        render();
      });

      grid.appendChild(card);
    });
  }

  /* ── Export PDF ── */
  exportBtn.addEventListener('click', async () => {
    if (!files.length) return;
    if (typeof window.jspdf === 'undefined') {
      showToast('❌ 正在加载 PDF 库，请稍后重试', 'error');
      return;
    }

    exportBtn.disabled = true;
    toolbar.style.pointerEvents = 'none';
    progWrap.style.display = 'block';
    setProgress(0, '准备中…');

    const { jsPDF } = window.jspdf;
    const pageSize  = document.getElementById('page-size').value;
    const orient    = document.getElementById('orientation').value;
    const marginPx  = parseInt(document.getElementById('margin').value, 10);
    const quality   = parseInt(document.getElementById('quality-slider').value, 10) / 100;

    try {
      let pdf = null;

      for (let i = 0; i < files.length; i++) {
        setProgress(Math.round((i / files.length) * 90), `处理第 ${i + 1} / ${files.length} 张…`);

        const imgData = await loadImageAsDataURL(files[i].url, quality);
        const { width: imgW, height: imgH } = await getImageDimensions(files[i].url);

        let docOrient = orient;
        if (orient === 'auto') docOrient = imgW >= imgH ? 'landscape' : 'portrait';

        let format = pageSize === 'fit' ? [mmFromPx(imgW), mmFromPx(imgH)] : pageSize.toUpperCase();

        if (i === 0) {
          pdf = new jsPDF({ orientation: docOrient, unit: 'mm', format });
        } else {
          pdf.addPage(format, docOrient);
        }

        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const margin = mmFromPx(marginPx);
        const maxW = pw - margin * 2;
        const maxH = ph - margin * 2;

        const ratio = Math.min(maxW / mmFromPx(imgW), maxH / mmFromPx(imgH));
        const drawW = mmFromPx(imgW) * ratio;
        const drawH = mmFromPx(imgH) * ratio;
        const x = margin + (maxW - drawW) / 2;
        const y = margin + (maxH - drawH) / 2;

        // Always use JPEG for compression; quality controlled by slider
        pdf.addImage(imgData, 'JPEG', x, y, drawW, drawH);

        await sleep(10); // yield to UI
      }

      setProgress(95, '保存 PDF…');
      await sleep(50);
      pdf.save(`converted_${Date.now()}.pdf`);
      setProgress(100, '完成！');
      await sleep(600);
      showToast(`✅ PDF 已成功导出（${files.length} 页）`, 'success');
    } catch (err) {
      console.error(err);
      showToast('❌ 导出失败：' + err.message, 'error');
    } finally {
      await sleep(800);
      progWrap.style.display = 'none';
      exportBtn.disabled = false;
      toolbar.style.pointerEvents = '';
    }
  });

  /* ── Helpers ── */
  function mmFromPx(px, dpi = 96) { return px * 25.4 / dpi; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function setProgress(pct, text) {
    progFill.style.width = pct + '%';
    progPct.textContent  = pct + '%';
    if (text) progText.textContent = text;
  }

  function loadImageAsDataURL(url, jpegQuality = 0.85) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        // Fill white background so transparent PNGs look correct in JPEG
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', jpegQuality));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  function getImageDimensions(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = reject;
      img.src = url;
    });
  }

  let toastTimer;
  function showToast(msg, type = '') {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'show ' + type;
    toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
  }

  /* Initial render */
  render();
})();
</script>
</body>
</html>
